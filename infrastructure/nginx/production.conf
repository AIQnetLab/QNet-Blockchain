# QNet Production TLS Reverse Proxy
# FIX R22-C7: Terminates HTTPS for all API endpoints
# Architecture: nginx → plain HTTP backend (qnet nodes on internal Docker network)
#
# SETUP:
#   1. Place SSL certificate at ./ssl/fullchain.pem
#   2. Place SSL private key at ./ssl/privkey.pem
#   3. For testing: openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#        -keyout ssl/privkey.pem -out ssl/fullchain.pem -subj '/CN=qnet-testnet'

upstream qnet_genesis {
    server qnet-genesis:8001;
}

upstream qnet_validator1 {
    server qnet-validator1:8001;
}

upstream qnet_validator2 {
    server qnet-validator2:8001;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;

    # Health check endpoint (plain HTTP for Docker healthcheck)
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    # TLS configuration (modern profile)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Request size limit (matches warp content_length_limit)
    client_max_body_size 2m;

    # Rate limiting zone (10 req/s per IP for registration)
    limit_req_zone $binary_remote_addr zone=register:10m rate=10r/s;

    # Genesis node API (primary)
    location /api/v1/ {
        proxy_pass http://qnet_genesis/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Registration endpoint with stricter rate limiting
    location /api/v1/register {
        limit_req zone=register burst=5 nodelay;
        proxy_pass http://qnet_genesis/api/v1/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Validator 1
    location /validator1/api/v1/ {
        proxy_pass http://qnet_validator1/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Validator 2
    location /validator2/api/v1/ {
        proxy_pass http://qnet_validator2/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
