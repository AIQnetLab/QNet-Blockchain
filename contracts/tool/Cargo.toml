[package]
name = "qnet-contract-tool"
version = "0.1.0"
edition = "2021"
description = "Builds QNet contracts for wasm32 and checks them against the node's deploy rules."
publish = false

[[bin]]
name = "qnet-contract-tool"
path = "src/main.rs"

[dependencies]
# The node's own VM: deploy validator and executor. Path dependency only; nothing in core/ changes.
qnet-vm = { path = "../../core/qnet-vm" }
# Same parser line the validator uses, for the import and export checks.
wasmparser = "0.252"
serde_json = "1"
# The address checksum (SHA3-256) of address-valued build variables.
sha3 = "0.10"

[dev-dependencies]
wat = "1"
# The contract helper's own address check, compared with the checksum here (tests/build_env.rs).
qnet-contract = { path = "../qnet-contract" }
