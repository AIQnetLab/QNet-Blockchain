[workspace]
members = [
    "core/qnet-core",
    "core/qnet-consensus", 
    "core/qnet-mempool",
    "core/qnet-state",
    "core/qnet-sharding",
    "core/qnet-vm",
    "development/qnet-integration",
    "development/qnet-loadtest",
    "audit"
]
resolver = "2"

# Default features for production builds
[workspace.metadata]
default-features = ["production"]

[workspace.dependencies]
# Core blockchain dependencies - production ready versions
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0.195", features = ["derive"] }
ed25519-dalek = { version = "2.0.0", features = ["std"] }
actix-web = "4.4"
rocksdb = "0.21" 

# Production build profiles for entire workspace
[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 3
debug = false
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

[profile.dev]
# Line tables only. Full debug info grew the crate rlib past 4 GB, which link.exe cannot read as an
# archive — it silently skips the library and the build dies on thousands of unresolved symbols.
# Panics still carry file:line.
debug = 1

[profile.test]
opt-level = 2  # Optimize tests for better performance

[profile.bench]
debug = true   # Include debug info in benchmarks 