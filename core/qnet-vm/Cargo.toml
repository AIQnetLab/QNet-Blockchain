[package]
name = "qnet-vm"
version = "0.1.0"
edition = "2021"
description = "Deterministic on-chain smart-contract VM: deploy-time WASM determinism validation + the fuel-metered interpreter used for contract execution. Leaf crate — NO consensus-code deps, but its output feeds the state_root."

[dependencies]
# Deploy-time module validation.
wasmparser = "0.252"
# Execution interpreter. Pinned to the latest STABLE line (NOT the 2.0 beta):
# a deterministic, fuel-metered, pure-Rust interpreter. CONSENSUS-CRITICAL —
# a version bump is a hard fork (re-equivalence-test required).
wasmi = "0.47"

[dev-dependencies]
# Compile readable WAT test contracts → WASM in unit tests (already in the tree
# transitively via wasmi's dev deps). Test-only — NOT a runtime/consensus dep.
wat = "1"
