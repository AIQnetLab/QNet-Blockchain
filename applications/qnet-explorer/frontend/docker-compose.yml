version: '3.8'

services:
  qnet-explorer-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qnet-explorer-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8545
      - NEXT_PUBLIC_NETWORK=mainnet
      - DATABASE_URL=postgresql://qnet_user:${POSTGRES_PASSWORD}@host.docker.internal:5432/qnet_explorer
      - QNET_API_URL=${QNET_API_URL:-https://162.244.25.114:8001}
      - REDIS_URL=${REDIS_URL:-}
      - SECURITY_WEBHOOK_URL=${SECURITY_WEBHOOK_URL:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - DB_SSL=${DB_SSL:-true}
      - DB_SSL_REJECT_UNAUTHORIZED=${DB_SSL_REJECT_UNAUTHORIZED:-true}
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - qnet-network

  # Optional: Redis for distributed rate limiting
  redis:
    image: redis:7-alpine
    container_name: qnet-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - qnet-network

  # Optional: Add nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: qnet-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - qnet-explorer-frontend
    restart: unless-stopped
    networks:
      - qnet-network

volumes:
  redis-data:

networks:
  qnet-network:
    driver: bridge 