# ============================================================================
# QNet Explorer - PostgreSQL Security Configuration
# Production-ready settings for maximum security
# ============================================================================

# ----------------------------------------------------------------------------
# CONNECTION SETTINGS
# ----------------------------------------------------------------------------

# CRITICAL: Restrict listening to localhost only (development)
# For production: Set to specific server IP or 'localhost' if app is on same server
listen_addresses = 'localhost'
port = 5432

# Maximum connections (prevent resource exhaustion)
max_connections = 100
superuser_reserved_connections = 3

# ----------------------------------------------------------------------------
# SECURITY AND AUTHENTICATION
# ----------------------------------------------------------------------------

# Password encryption method (most secure)
password_encryption = scram-sha-256

# SSL/TLS Settings (REQUIRED for production with remote connections)
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'
ssl_ca_file = 'root.crt'
ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'

# ----------------------------------------------------------------------------
# CONNECTION LIMITS AND TIMEOUTS
# ----------------------------------------------------------------------------

# Prevent brute force attacks by limiting connection rate
# Note: This requires connection pooler like PgBouncer for best results
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 3

# Statement timeout (prevent long-running queries from hogging resources)
statement_timeout = 30000  # 30 seconds

# Idle connection timeout
idle_in_transaction_session_timeout = 60000  # 60 seconds

# ----------------------------------------------------------------------------
# LOGGING FOR SECURITY MONITORING
# ----------------------------------------------------------------------------

# Log all connection attempts
log_connections = on
log_disconnections = on

# Log failed authentication attempts (CRITICAL for brute force detection)
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# Log authentication failures
log_hostname = off  # Disable reverse DNS lookups (performance)

# Log all DDL statements (schema changes)
log_statement = 'ddl'

# Log slow queries
log_min_duration_statement = 1000  # Log queries > 1 second

# ----------------------------------------------------------------------------
# RESOURCE LIMITS (Prevent DoS)
# ----------------------------------------------------------------------------

# Shared memory
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

# Prevent excessive temp file usage
temp_file_limit = 10GB

# ----------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL) SETTINGS
# ----------------------------------------------------------------------------

wal_level = replica
max_wal_senders = 3
wal_keep_size = 128MB

# ----------------------------------------------------------------------------
# QUERY PLANNING
# ----------------------------------------------------------------------------

# Random page cost (optimize for SSD)
random_page_cost = 1.1

# Effective IO concurrency
effective_io_concurrency = 200

# ----------------------------------------------------------------------------
# ADDITIONAL SECURITY SETTINGS
# ----------------------------------------------------------------------------

# Prevent non-superusers from creating objects in public schema
# Run: REVOKE CREATE ON SCHEMA public FROM PUBLIC;

# Disable local file access from SQL
allow_in_place_tablespaces = off

# ============================================================================
# PRODUCTION DEPLOYMENT NOTES:
# ============================================================================
# 
# 1. FIREWALL: Block port 5432 from external access
#    - Only allow connections from application server IP
#    - Use security groups (AWS/Azure) or iptables (Linux)
#
# 2. CHANGE PASSWORD: After applying this config, change qnet_user password:
#    psql -U postgres -c "ALTER USER qnet_user WITH PASSWORD 'STRONG_PASSWORD_HERE';"
#
# 3. SSL CERTIFICATES: Generate SSL certificates for encrypted connections:
#    openssl req -new -x509 -days 365 -nodes -text -out server.crt -keyout server.key
#    chmod 600 server.key
#    chown postgres:postgres server.key server.crt
#
# 4. FAIL2BAN: Install fail2ban to block brute force attempts:
#    - Monitor /var/log/postgresql/postgresql-*.log
#    - Ban IPs after 5 failed login attempts
#
# 5. CONNECTION POOLER: Use PgBouncer for connection pooling:
#    - Limits concurrent connections
#    - Provides additional authentication layer
#    - Improves performance
#
# 6. MONITORING: Set up alerts for:
#    - Failed authentication attempts (> 5 per minute)
#    - Unusual connection patterns
#    - Slow queries
#    - High resource usage
#
# 7. BACKUPS: Implement automated backups with encryption:
#    pg_dump -U qnet_user qnet_explorer | gzip | gpg -e > backup.sql.gz.gpg
#
# ============================================================================

