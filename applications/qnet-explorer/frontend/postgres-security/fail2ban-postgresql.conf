# ============================================================================
# Fail2ban Configuration for PostgreSQL
# Place this file in /etc/fail2ban/jail.d/postgresql.conf
# ============================================================================

[postgresql]
# Enable this jail
enabled = true

# Port to monitor (PostgreSQL default)
port = 5432

# Filter to use (defined in filter.d/postgresql.conf)
filter = postgresql

# Log file to monitor
logpath = /var/log/postgresql/postgresql-*.log

# Maximum number of failed attempts before ban
maxretry = 5

# Time window for counting retries (in seconds) - 10 minutes
findtime = 600

# Ban duration (in seconds) - 1 hour
# For production, consider longer ban times (e.g., 86400 for 24 hours)
bantime = 3600

# Action to take when ban occurs
# Default: iptables-multiport (blocks all ports)
# For PostgreSQL-specific: iptables-allports
action = %(action_mwl)s

# Email notifications (configure if needed)
# destemail = admin@yourdomain.com
# sender = fail2ban@yourdomain.com
# action = %(action_mwl)s  # Send email with logs

# ============================================================================
# Production Recommendations:
# ============================================================================
#
# 1. **Increase ban time for production**:
#    bantime = 86400  # 24 hours
#    bantime = -1     # Permanent ban (manual unban required)
#
# 2. **Reduce max retries**:
#    maxretry = 3     # More aggressive
#
# 3. **Enable email notifications**:
#    destemail = security@yourdomain.com
#    action = %(action_mwl)s
#
# 4. **Whitelist trusted IPs**:
#    ignoreip = 127.0.0.1/8 ::1 YOUR_APP_SERVER_IP
#
# 5. **Monitor fail2ban status**:
#    sudo fail2ban-client status postgresql
#    sudo fail2ban-client set postgresql unbanip <IP>
#
# 6. **View banned IPs**:
#    sudo fail2ban-client get postgresql banned
#
# 7. **Test filter**:
#    sudo fail2ban-regex /var/log/postgresql/postgresql-*.log /etc/fail2ban/filter.d/postgresql.conf
#
# ============================================================================

