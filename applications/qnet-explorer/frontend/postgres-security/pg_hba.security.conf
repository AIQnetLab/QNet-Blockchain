# ============================================================================
# QNet Explorer - PostgreSQL Host-Based Authentication Configuration
# Production-ready settings for maximum security
# ============================================================================
#
# This file controls: which hosts are allowed to connect, how clients
# are authenticated, which PostgreSQL user names they can use, which
# databases they can access.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
#
# "local" is for Unix domain socket connections only
# "host" is for TCP/IP connections (unencrypted)
# "hostssl" is for TCP/IP connections with SSL encryption (RECOMMENDED)
# "hostnossl" is for TCP/IP connections without SSL
#
# METHOD can be:
#   - trust: Allow connection without password (INSECURE!)
#   - reject: Reject connection
#   - scram-sha-256: Password authentication (most secure)
#   - md5: Password authentication (legacy, less secure)
#   - peer: Use OS username (local connections only)
#   - cert: SSL certificate authentication
#
# ============================================================================

# ============================================================================
# CRITICAL SECURITY RULES
# ============================================================================

# 1. REJECT all connections by default (whitelist approach)
# This line should be at the END of the file to act as a catch-all
# Placed at top for visibility - will be overridden by specific rules below

# ============================================================================
# LOCAL CONNECTIONS (Development)
# ============================================================================

# PostgreSQL administrative user - local only
local   all             postgres                                peer

# QNet Explorer database - local connections (development)
local   qnet_explorer   qnet_user                               scram-sha-256

# Allow localhost connections (IPv4 and IPv6)
host    qnet_explorer   qnet_user       127.0.0.1/32            scram-sha-256
host    qnet_explorer   qnet_user       ::1/128                 scram-sha-256

# ============================================================================
# PRODUCTION SERVER CONNECTIONS (Uncomment and configure for production)
# ============================================================================

# Example: Allow connections from specific application server IP
# Replace XXX.XXX.XXX.XXX with your application server IP
# hostssl qnet_explorer   qnet_user       XXX.XXX.XXX.XXX/32      scram-sha-256

# Example: Allow connections from private network (Docker/VPC)
# Replace 172.16.0.0/12 with your actual private network range
# hostssl qnet_explorer   qnet_user       172.16.0.0/12           scram-sha-256

# ============================================================================
# SSL-ONLY PRODUCTION CONFIGURATION (Recommended)
# ============================================================================

# Force SSL for all remote connections (production)
# Uncomment these lines for production deployment:
# hostssl qnet_explorer   qnet_user       10.0.0.0/8              scram-sha-256
# hostssl qnet_explorer   qnet_user       172.16.0.0/12           scram-sha-256
# hostssl qnet_explorer   qnet_user       192.168.0.0/16          scram-sha-256

# ============================================================================
# REJECT ALL OTHER CONNECTIONS
# ============================================================================

# Explicitly reject connections from anywhere else
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject

# ============================================================================
# SECURITY NOTES FOR PRODUCTION:
# ============================================================================
#
# 1. **IP WHITELISTING**: 
#    - Only allow connections from known application server IPs
#    - Use /32 for single IP, /24 for subnet
#    - Never use 0.0.0.0/0 (allows all IPs)
#
# 2. **SSL/TLS ENFORCEMENT**:
#    - Use 'hostssl' instead of 'host' for remote connections
#    - Generates certificates:
#      openssl req -new -x509 -days 365 -nodes -text \
#        -out /var/lib/postgresql/15/data/server.crt \
#        -keyout /var/lib/postgresql/15/data/server.key
#      chmod 600 /var/lib/postgresql/15/data/server.key
#      chown postgres:postgres /var/lib/postgresql/15/data/server.*
#
# 3. **AUTHENTICATION METHOD**:
#    - Always use 'scram-sha-256' (most secure)
#    - NEVER use 'trust' (allows passwordless access)
#    - Avoid 'md5' (outdated, vulnerable to attacks)
#
# 4. **PRINCIPLE OF LEAST PRIVILEGE**:
#    - qnet_user should ONLY have access to qnet_explorer database
#    - Don't grant superuser privileges
#    - Don't allow access to postgres/template databases
#
# 5. **FAIL2BAN INTEGRATION**:
#    - Monitor logs for failed authentication attempts
#    - Auto-ban IPs with > 5 failed attempts in 10 minutes
#    - Example fail2ban filter:
#      failregex = ^.*FATAL:.*authentication failed for user.*from host <HOST>
#
# 6. **CONNECTION RATE LIMITING**:
#    - Use PgBouncer or similar pooler to limit connection rate
#    - Set max_connections in postgresql.conf
#    - Monitor active connections: SELECT count(*) FROM pg_stat_activity;
#
# 7. **MONITORING**:
#    - Enable log_connections and log_disconnections
#    - Set up alerts for unusual connection patterns
#    - Track failed authentication attempts
#
# 8. **DOCKER/KUBERNETES DEPLOYMENTS**:
#    - Use private networks (172.16.0.0/12, 10.0.0.0/8)
#    - Don't expose PostgreSQL port externally
#    - Use service discovery instead of hardcoded IPs
#
# 9. **CLOUD DEPLOYMENTS (AWS/Azure/GCP)**:
#    - Use VPC/VNET for network isolation
#    - Enable security groups to restrict access
#    - Use managed database services (RDS/Azure DB) when possible
#
# 10. **PASSWORD POLICY**:
#     - Minimum 20 characters
#     - Mix of uppercase, lowercase, numbers, special characters
#     - Rotate passwords every 90 days
#     - Never commit passwords to version control
#     - Use environment variables or secrets management
#
# ============================================================================
# TESTING YOUR CONFIGURATION:
# ============================================================================
#
# 1. Test local connection:
#    psql -U qnet_user -d qnet_explorer -h localhost
#
# 2. Test remote connection (from app server):
#    psql -U qnet_user -d qnet_explorer -h <db_server_ip>
#
# 3. Verify SSL is working:
#    psql "postgresql://qnet_user@<db_server_ip>/qnet_explorer?sslmode=require"
#
# 4. Check active connections:
#    SELECT usename, client_addr, state FROM pg_stat_activity;
#
# 5. Monitor failed authentication attempts:
#    grep "authentication failed" /var/log/postgresql/postgresql-*.log
#
# ============================================================================

