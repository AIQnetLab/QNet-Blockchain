version: '3.8'

services:
  # PostgreSQL database for indexer
  postgres:
    image: postgres:16-alpine
    container_name: qnet-indexer-db
    restart: always
    environment:
      POSTGRES_USER: qnet
      POSTGRES_PASSWORD: qnet_password
      POSTGRES_DB: qnet_indexer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qnet -d qnet_indexer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # QNet Indexer service
  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qnet-indexer
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qnet:qnet_password@postgres:5432/qnet_indexer
      QNET_NODE_URL: http://host.docker.internal:8001
      INDEXER_API_PORT: 9000
      # SECURITY: Set these in production!
      # INDEXER_API_KEY: your-secret-api-key
      # INDEXER_CORS_ORIGINS: https://explorer.qnet.io,https://app.qnet.io
      RUST_LOG: info,qnet_indexer=debug
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:

