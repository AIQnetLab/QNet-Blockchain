apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
    // With the store flavors the debug variants are siteDebug / playDebug; they load JS from Metro.
    debuggableVariants = ["siteDebug", "playDebug", "siteDebugOptimized", "playDebugOptimized"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Load keystore properties if file exists
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.qnetmobile"
    defaultConfig {
        applicationId "com.qnetmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 17
        versionName "1.1.6"
        manifestPlaceholders = [usesCleartextTraffic: "true"]

        // NDK: pqclean Dilithium3 reference C code (same as pqcrypto-dilithium 0.5).
        // Build ALL ABIs so libdilithium_native.so is present on every device: many low-end
        // Android (Go) phones run a 32-bit userspace on a 64-bit CPU, so an arm64-only lib made
        // the app crash at launch (UnsatisfiedLinkError from DilithiumModule's static loader).
        // armeabi-v7a = 32-bit real devices; x86/x86_64 = emulators. pqclean ref C is portable.
        externalNativeBuild {
            cmake {
                cppFlags ""
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                // Fallback to environment variables or dummy values
                storeFile file('qnet-release-key.keystore')
                storePassword System.getenv("QNET_KEYSTORE_PASSWORD") ?: 'CHANGE_ME'
                keyAlias 'qnet-key-alias'
                keyPassword System.getenv("QNET_KEY_PASSWORD") ?: 'CHANGE_ME'
            }
        }
    }
    // Two distributions of one app. `site` keeps com.qnetmobile, the id every APK from aiqnet.io and GitHub
    // has carried, so an update installs over what users already run. `play` is io.aiqnet.wallet: Google
    // Play keeps a package name forever, and com.qnetmobile stays reserved by a closed developer account.
    // Both are registered in the same Firebase project, so light-node pushes reach either.
    flavorDimensions "store"
    productFlavors {
        site {
            dimension "store"
            applicationId "com.qnetmobile"
        }
        play {
            dimension "store"
            applicationId "io.aiqnet.wallet"
            // ARM only: Play requires 16 KB-aligned 64-bit libraries, and the x86_64 libconceal shipped by
            // react-native-keychain 8 is 4 KB-aligned; x86 cannot ship without its 64-bit twin.
            ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Bouncy Castle removed — Dilithium3 now handled by native pqclean C code (NDK)
    // pqclean dilithium3 is compiled via externalNativeBuild/CMakeLists.txt
}
