apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// The last update of the old package com.qnetmobile, for the installs that still have it: the same app with the
// wallet only, no node, and a notice to install io.aiqnet.wallet and restore there with the recovery phrase
// (./gradlew assembleRelease -PqnetLegacyMove, published once as a GitHub release, only after the Play listing is public:
// release order and tag rule in docs/applications/mobile-wallet.md; never on Google Play or aiqnet.io).
def legacyMove = project.hasProperty("qnetLegacyMove")

react {
    autolinkLibrariesWithApp()
    // Only that update's JavaScript carries the move notice, its texts and its link (metro.legacy.config.js).
    if (legacyMove) bundleConfig = file("../../metro.legacy.config.js")
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Load keystore properties if file exists
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.qnetmobile"
    defaultConfig {
        // One Android package: the Play-signed file from Google Play is the file aiqnet.io serves.
        applicationId legacyMove ? "com.qnetmobile" : "io.aiqnet.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "1.3.0"
        buildConfigField "boolean", "QNET_LEGACY_MOVE", legacyMove ? "true" : "false"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // NDK: pqclean Dilithium3 reference C code (same as pqcrypto-dilithium 0.5).
        // Build ALL ABIs so libdilithium_native.so is present on every device: many low-end
        // Android (Go) phones run a 32-bit userspace on a 64-bit CPU, so an arm64-only lib made
        // the app crash at launch (UnsatisfiedLinkError from DilithiumModule's static loader).
        // armeabi-v7a = 32-bit real devices; x86/x86_64 = emulators. pqclean ref C is portable.
        externalNativeBuild {
            cmake {
                cppFlags ""
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                // Fallback to environment variables or dummy values
                storeFile file('qnet-release-key.keystore')
                storePassword System.getenv("QNET_KEYSTORE_PASSWORD") ?: 'CHANGE_ME'
                keyAlias 'qnet-key-alias'
                keyPassword System.getenv("QNET_KEY_PASSWORD") ?: 'CHANGE_ME'
            }
        }
    }
    // Debug-only resources: the network security config that also lets a debug build reach Metro on this
    // machine. Kept outside `src/debug`, which the repository's .gitignore excludes as a build folder.
    sourceSets {
        debug.res.srcDirs += 'src/metroDebug/res'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            // ARM only: Play requires 16 KB-aligned 64-bit libraries, and x86 cannot ship without its 64-bit twin.
            // Debug builds keep every ABI for emulators.
            ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // BiometricPrompt with a CryptoObject for the vault's biometric key (SecurityModule).
    implementation("androidx.biometric:biometric:1.1.0")

    // Google Play's classic integrity token and its dialogs, for the device check of a light node (DeviceAttestModule).
    implementation("com.google.android.play:integrity:1.6.0")

    // JVM tests (src/test) and on-device tests of the device key (src/androidTest).
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")

    // Bouncy Castle removed — Dilithium3 now handled by native pqclean C code (NDK)
    // pqclean dilithium3 is compiled via externalNativeBuild/CMakeLists.txt
}

// No release build without a light-client pin the release gate accepts (MOBNET-R5-03): written by
// scripts/ws-pin.js, proven from the previous pin, recent. Debug builds are not held back.
def qnetReleaseCheck = tasks.register("qnetReleaseCheck", Exec) {
    workingDir = file("../..")
    commandLine "node", "scripts/release-check.js"
}
// Nor one whose release JS bundle carries a removed flow or a forbidden text (the Metro half of the bundle scan,
// __tests__/BundleContent.test.js). The old package's last update is scanned as it is built, with the legacy config: its
// move notice must be in it (--legacy).
def qnetBundleCheck = tasks.register("qnetBundleCheck", Exec) {
    workingDir = file("../..")
    commandLine(["node", "scripts/bundle-check.js", "--platform", "android"] + (legacyMove ? ["--legacy"] : []))
}
tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") task.dependsOn(qnetReleaseCheck, qnetBundleCheck)
}
