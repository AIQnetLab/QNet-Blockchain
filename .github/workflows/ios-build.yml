name: iOS build

# Compiles the wallet for the iOS simulator on a clean macOS runner, unsigned: proof that the Xcode
# project, the pods and the native ML-DSA module build outside one developer's machine, once the checks job
# passed (dependency audit, unit tests, light-client pin). A manual run, or a push whose commit message carries
# [testflight], also archives a signed Release build and uploads it to TestFlight (the testflight job). A manual run
# with the screenshots input also takes the App Store screenshots of the simulator build (the screenshots job).
#
# The simulator and testflight jobs resolve the pods after npm ci and the patches, compare the result with
# ios/Podfile.lock and keep the resolved lock as an artifact: the committed lock is replaced by that file, never
# edited by hand.

on:
  push:
    branches: [testnet, main]
    paths:
      - 'applications/qnet-mobile/**'
      - 'docs/protocols/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'applications/qnet-mobile/**'
      - 'docs/protocols/**'
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also archive, sign and upload the build to TestFlight'
        type: boolean
        default: true
      screenshots:
        description: 'Also take the App Store screenshots on an iPhone 6.9" and an iPad 13" simulator'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The gate the build waits for (MOBNET-R5-03): the production dependency audit, the unit tests and the light-client
  # pin check against the live head. Nothing in it may fail.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: applications/qnet-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: applications/qnet-mobile/package-lock.json

      - name: Install JavaScript dependencies
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx patch-package || (cd node_modules/react-native-quick-crypto && patch -p1 --forward < ../../patches/react-native-quick-crypto+1.0.15.patch)
          grep -q 'QNet patch (origin integrity)' node_modules/react-native-webview/apple/RNCWebViewImpl.m

      - name: Dependency audit
        run: npm run audit:prod

      - name: Unit tests
        run: npx jest --testTimeout=60000

      # The release bundles of both platforms carry no removed flow, and the iOS one none of Android's own texts.
      - name: Bundle scan
        run: node scripts/bundle-check.js --platform all

      - name: Light-client pin
        run: npm run check:release -- --online

  simulator:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: applications/qnet-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: applications/qnet-mobile/package-lock.json

      # patch-package runs as postinstall; when its context does not match on this platform the patch
      # is applied by hand with fuzz, which is what it needs (a two-line compiler-flag change).
      # patch-package applies every patch it can before it reports a failure, so the webview patch is in place
      # either way; the in-app browser's origin integrity lives in it, and the build stops if it is not.
      - name: Install JavaScript dependencies
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx patch-package || (cd node_modules/react-native-quick-crypto && patch -p1 --forward < ../../patches/react-native-quick-crypto+1.0.15.patch)
          grep -q 'QNet patch (origin integrity)' node_modules/react-native-webview/apple/RNCWebViewImpl.m

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: applications/qnet-mobile

      - name: Install pods
        run: |
          cp ios/Podfile.lock "$RUNNER_TEMP/Podfile.lock.repo"
          bundle exec pod install --project-directory=ios

      # The native modules come from node_modules, so a new package version changes the pods without a Podfile
      # change. A lock that differs is reported with its diff; the resolved one is kept to be committed.
      - name: Compare the pod lock with the repository's
        run: |
          if cmp -s "$RUNNER_TEMP/Podfile.lock.repo" ios/Podfile.lock; then
            echo 'ios/Podfile.lock matches the pods this run resolved.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning file=applications/qnet-mobile/ios/Podfile.lock::pod install resolved other pods than ios/Podfile.lock records; commit the ios-podfile-lock artifact of this run"
            {
              echo '## ios/Podfile.lock differs from the resolved pods'
              echo 'Commit the `ios-podfile-lock` artifact of this run as `applications/qnet-mobile/ios/Podfile.lock`.'
              echo '```diff'
              { diff -u "$RUNNER_TEMP/Podfile.lock.repo" ios/Podfile.lock || true; } | head -n 400
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the resolved pod lock
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-lock
          path: applications/qnet-mobile/ios/Podfile.lock

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/QNetMobile.xcworkspace -scheme QNetMobile -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log | tail -n 200

      # A build proves nothing about starting: build 21 reached TestFlight and stopped at its first line, because
      # FirebaseApp.configure() found no GoogleService-Info.plist in the bundle. The Release app is installed on a
      # booted iPhone simulator and must still run 40 s after launch; otherwise its console and crash report go to
      # the summary and the job fails, and the testflight job, which waits for this one, uploads nothing.
      - name: Launch on a simulator
        run: |
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          # The newest iOS runtime and the newest iPhone it lists as supported (an iPhone Pro type otherwise).
          xcrun simctl list runtimes -j > runtimes.json
          xcrun simctl list devicetypes -j > devicetypes.json
          read -r RUNTIME DTYPE < <(python3 -c "
          import json
          r = [x for x in json.load(open('runtimes.json'))['runtimes'] if x['isAvailable'] and 'iOS' in x['identifier']][-1]
          d = [t for t in r.get('supportedDeviceTypes', []) if t['name'].startswith('iPhone')]
          d = d or [t for t in json.load(open('devicetypes.json'))['devicetypes'] if t['name'].startswith('iPhone') and 'Pro' in t['name']]
          print(r['identifier'], d[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create launch-check "$DTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          touch launch-start
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --console-pty "$UDID" "$BID" > launch-console.txt 2>&1 &
          sleep 40
          if xcrun simctl spawn "$UDID" launchctl list | awk -v b="UIKitApplication:$BID" 'index($3, b) == 1 && $1 != "-" { found = 1 } END { exit !found }'; then
            echo "QNet Wallet ($BID) still runs 40 s after launch on $DTYPE, $RUNTIME." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## The app did not survive its launch on the simulator'
            echo '### console'
            echo '```'; tail -n 80 launch-console.txt; echo '```'
            for f in $(find ~/Library/Logs/DiagnosticReports -type f -newer launch-start 2>/dev/null); do
              echo "### crash report $(basename "$f")"
              echo '```'
              python3 - "$f" <<'PY' || head -c 4000 "$f"
          import json, sys
          raw = open(sys.argv[1], errors='replace').read()
          head, _, rest = raw.partition('\n')
          body = json.loads(rest) if rest.strip().startswith('{') else json.loads(raw)
          print('exception:', json.dumps(body.get('exception')))
          print('termination:', json.dumps(body.get('termination')))
          print('asi:', json.dumps(body.get('asi'))[:2000])
          images = body.get('usedImages', [])
          for frame in (body.get('lastExceptionBacktrace') or [])[:30]:
              index = frame.get('imageIndex')
              name = images[index].get('name', '?') if index is not None and index < len(images) else '?'
              print(' ', name, frame.get('symbol', '?'))
          PY
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::QNet Wallet does not run 40 s after launch on the simulator"
          exit 1

      # The screenshots job installs this same build, once it survived its launch. A tar keeps the app's file modes,
      # which an artifact alone does not. Neither step can fail this job and so skip TestFlight: without the artifact
      # the screenshots job stops at its fetch.
      - name: Pack the simulator app for the screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        continue-on-error: true
        run: |
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)
          tar -czf "$RUNNER_TEMP/simulator-app.tgz" -C "$(dirname "$APP")" "$(basename "$APP")"

      - name: Keep the simulator app for the screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/simulator-app.tgz
          retention-days: 1
          if-no-files-found: error

      # The job summary is readable without signing in to GitHub, the raw log is not: on failure the
      # compiler errors and the tail of the log go there, so a failed run explains itself to anyone.
      - name: Summarise the failure
        if: failure()
        run: |
          {
            echo '## xcodebuild failed'
            echo '### errors'
            echo '```'
            grep -E '(error:|fatal error:|\*\* BUILD FAILED|The following build commands failed)' xcodebuild.log | sort -u | head -n 80
            echo '```'
            echo '### last 120 lines'
            echo '```'
            tail -n 120 xcodebuild.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            applications/qnet-mobile/xcodebuild.log
            applications/qnet-mobile/build/Logs
          if-no-files-found: ignore

  # The App Store screenshots of the simulator job's build, on a manual run with the screenshots input: an iPhone of the
  # 6.9" display size and an iPad of the 13" one (scripts/store-screenshots.js, flows in store-screenshots/). The
  # recovery phrase is the secret QNET_SCREENSHOT_PHRASE, given only to the step that uses it; without it the run uses a
  # new wallet.
  screenshots:
    needs: simulator
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: applications/qnet-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: applications/qnet-mobile/package-lock.json

      # The script makes the run's phrase with the app's own phrase library when the secret is not set.
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      # The flow runner needs Java 17 or later.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # One fixed release, its archive checked against the SHA-256 the release publishes, and no install script: a newer
      # runner never changes the screenshots of an unchanged repository, and nothing unpinned runs on the runner that
      # later holds the recovery phrase.
      - name: Install the flow runner
        env:
          MAESTRO_VERSION: 2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
          MAESTRO_CLI_NO_ANALYTICS: '1'
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          ACTUAL=$(shasum -a 256 "$RUNNER_TEMP/maestro.zip" | cut -d ' ' -f 1)
          if [ "$ACTUAL" != "$MAESTRO_SHA256" ]; then
            echo "::error::the flow runner archive has SHA-256 $ACTUAL, the release $MAESTRO_VERSION published $MAESTRO_SHA256"
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-release"
          rm -rf "$HOME/.maestro/bin" "$HOME/.maestro/lib"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-release/maestro/." "$HOME/.maestro/"
          rm -rf "$RUNNER_TEMP/maestro.zip" "$RUNNER_TEMP/maestro-release"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          INSTALLED=$("$HOME/.maestro/bin/maestro" --version | tail -n 1)
          echo "Flow runner: Maestro $INSTALLED" >> "$GITHUB_STEP_SUMMARY"
          if [ "$INSTALLED" != "$MAESTRO_VERSION" ]; then
            echo "::error::the flow runner is $INSTALLED, the flows are pinned to $MAESTRO_VERSION"
            exit 1
          fi

      - name: Fetch the simulator app
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/simulator-app

      - name: Take the screenshots
        env:
          QNET_SCREENSHOT_PHRASE: ${{ secrets.QNET_SCREENSHOT_PHRASE }}
        run: |
          tar -xzf "$RUNNER_TEMP/simulator-app/simulator-app.tgz" -C "$RUNNER_TEMP/simulator-app"
          APP=$(find "$RUNNER_TEMP/simulator-app" -maxdepth 1 -name '*.app' | head -n 1)
          node scripts/store-screenshots.js capture --app "$APP" --out "$RUNNER_TEMP/app-store-screenshots"

      - name: Check the screenshot sizes
        run: node scripts/store-screenshots.js check "$RUNNER_TEMP/app-store-screenshots"

      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: ${{ runner.temp }}/app-store-screenshots
          if-no-files-found: error

      # A failed capture or check keeps whatever the run took: the scenes, and failed/ with the screen where the flows
      # stopped. Nothing there shows the recovery phrase: every capture comes after the import.
      - name: Keep what a failed run took
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-failed
          path: ${{ runner.temp }}/app-store-screenshots
          if-no-files-found: ignore

  # A signed Release archive of the QNetMobile scheme, uploaded to TestFlight, on a manual or [testflight] run.
  # Team 33H36C42XS signs with a distribution certificate and App Store profile the run makes through the App Store
  # Connect API key (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, Admin role); the build number is the project's
  # CURRENT_PROJECT_VERSION, so every upload needs a new one.
  # The secrets reach only the steps that use them, nothing prints them, and the key file is deleted at the end.
  testflight:
    # Only a build that started on the simulator is uploaded (the simulator job's launch check).
    needs: [checks, simulator]
    # The Run workflow button exists only for workflows on the default branch, so a push whose commit message
    # carries [testflight] starts this job too.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.testflight) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]'))
    runs-on: macos-26
    timeout-minutes: 90
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    env:
      TEAM_ID: 33H36C42XS
    defaults:
      run:
        working-directory: applications/qnet-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: applications/qnet-mobile/package-lock.json

      - name: Install JavaScript dependencies
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx patch-package || (cd node_modules/react-native-quick-crypto && patch -p1 --forward < ../../patches/react-native-quick-crypto+1.0.15.patch)
          grep -q 'QNet patch (origin integrity)' node_modules/react-native-webview/apple/RNCWebViewImpl.m

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: applications/qnet-mobile

      - name: Install pods
        run: |
          cp ios/Podfile.lock "$RUNNER_TEMP/Podfile.lock.repo"
          bundle exec pod install --project-directory=ios

      # The pods this release is built from, recorded beside it.
      - name: Compare the pod lock with the repository's
        run: |
          if cmp -s "$RUNNER_TEMP/Podfile.lock.repo" ios/Podfile.lock; then
            echo 'ios/Podfile.lock matches the pods this build uses.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning file=applications/qnet-mobile/ios/Podfile.lock::this build uses other pods than ios/Podfile.lock records; commit the testflight-podfile-lock artifact of this run"
            {
              echo '## ios/Podfile.lock differs from the pods of this build'
              echo 'Commit the `testflight-podfile-lock` artifact of this run as `applications/qnet-mobile/ios/Podfile.lock`.'
              echo '```diff'
              { diff -u "$RUNNER_TEMP/Podfile.lock.repo" ios/Podfile.lock || true; } | head -n 400
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the pod lock of this build
        uses: actions/upload-artifact@v4
        with:
          name: testflight-podfile-lock
          path: applications/qnet-mobile/ios/Podfile.lock

      - name: Read the version and build number
        run: |
          set -o pipefail
          xcodebuild -workspace ios/QNetMobile.xcworkspace -scheme QNetMobile -configuration Release -sdk iphoneos \
            -showBuildSettings -json 2>/dev/null > "$RUNNER_TEMP/settings.json"
          read -r version build < <(python3 -c 'import json, sys
          s = next(t["buildSettings"] for t in json.load(open(sys.argv[1])) if t["target"] == "QNetMobile")
          print(s["MARKETING_VERSION"], s["CURRENT_PROJECT_VERSION"])' "$RUNNER_TEMP/settings.json")
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ && "$build" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] \
            || { echo "::error::MARKETING_VERSION or CURRENT_PROJECT_VERSION is missing or malformed"; exit 1; }
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "Version $version ($build)"

      # altool looks for AuthKey_<key id>.p8 in ~/.appstoreconnect/private_keys; xcodebuild takes the same file by
      # path. ASC_KEY_P8 holds the .p8 text (or that text in base64).
      - name: Place the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] \
            || { echo "::error::set the secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8"; exit 1; }
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::ASC_KEY_ID is not a 10-character key id"; exit 1; }
          dir="$HOME/.appstoreconnect/private_keys"
          key="$dir/AuthKey_$ASC_KEY_ID.p8"
          install -d -m 0700 "$dir"
          umask 077
          if printf '%s' "$ASC_KEY_P8" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key" 2>/dev/null || true
          fi
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$key" \
            || { rm -f "$key"; echo "::error::ASC_KEY_P8 is not the .p8 key text"; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Automatic signing archives with a development profile, which needs a device registered to the team, so
      # this run makes its own distribution certificate and App Store profile through the API key
      # (scripts/asc-signing.py) and signs the app target by hand with them; the pods keep their own settings.
      - name: Create this run's signing identity
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.qnetmobile
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          sign="$RUNNER_TEMP/signing"
          kc="$RUNNER_TEMP/signing.keychain-db"
          install -d -m 0700 "$sign"
          python3 scripts/asc-signing.py prepare "$sign" > "$sign/env"
          cat "$sign/env" >> "$GITHUB_ENV"
          set -a; . "$sign/env"; set +a
          pw=$(/usr/bin/openssl rand -hex 24)
          /usr/bin/openssl x509 -inform der -in "$sign/cert.cer" -out "$sign/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$sign/key.pem" -in "$sign/cert.pem" -out "$sign/identity.p12" -passout "pass:$pw"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$sign/wwdr.cer"
          security create-keychain -p "$pw" "$kc"
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$sign/wwdr.cer" -k "$kc"
          security import "$sign/identity.p12" -k "$kc" -P "$pw" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$sign/key.pem" "$sign/csr.pem" "$sign/identity.p12"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            install -d "$dir"
            cp "$sign/profile.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done
          bundle exec ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/QNetMobile.xcodeproj")
            target = project.targets.find { |t| t.name == "QNetMobile" } or abort "no QNetMobile target"
            target.build_configurations.find { |c| c.name == "Release" }.build_settings.merge!(
              "CODE_SIGN_STYLE" => "Manual",
              "DEVELOPMENT_TEAM" => ENV.fetch("TEAM_ID"),
              "CODE_SIGN_IDENTITY" => "Apple Distribution",
              "CODE_SIGN_IDENTITY[sdk=iphoneos*]" => "Apple Distribution",
              "PROVISIONING_PROFILE_SPECIFIER" => ENV.fetch("PROFILE_NAME"))
            project.save'
          security find-identity -v -p codesigning "$kc"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -workspace ios/QNetMobile.xcworkspace -scheme QNetMobile -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/QNetMobile.xcarchive" -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO archive 2>&1 | tee xcodebuild.log | tail -n 200

      # manageAppVersionAndBuildNumber off: the uploaded build number is CURRENT_PROJECT_VERSION as archived.
      - name: Export for App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.qnetmobile</key><string>$PROFILE_NAME</string></dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/QNetMobile.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" 2>&1 | tee xcodebuild-export.log | tail -n 100
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)
          [ -n "$ipa" ] || { echo "::error::the export wrote no .ipa"; exit 1; }
          shipped=$(unzip -p "$ipa" 'Payload/*.app/Info.plist' | plutil -extract CFBundleVersion raw -o - -)
          [ "$shipped" = "$BUILD_NUMBER" ] || { echo "::error::the .ipa carries build $shipped, not $BUILD_NUMBER"; exit 1; }
          # FirebaseApp.configure() is the app's first line and stops it without this file; the architecture is the
          # legacy one, as on Android (Podfile RCT_NEW_ARCH_ENABLED).
          unzip -l "$ipa" | grep -qE 'Payload/[^/]+\.app/GoogleService-Info\.plist$' || { echo "::error::the .ipa has no GoogleService-Info.plist"; exit 1; }
          arch=$(unzip -p "$ipa" 'Payload/*.app/Info.plist' | plutil -extract RCTNewArchEnabled raw -o - - 2>/dev/null || echo missing)
          [ "$arch" = "false" ] || { echo "::error::RCTNewArchEnabled is $arch in the .ipa, not false"; exit 1; }
          echo "IPA=$ipa" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "UPLOADED=1" >> "$GITHUB_ENV"
          {
            echo '## Uploaded to TestFlight'
            echo "QNet Wallet $APP_VERSION ($BUILD_NUMBER), bundle com.qnetmobile. App Store Connect processes the build before testers see it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise the failure
        if: failure()
        run: |
          {
            echo '## TestFlight lane failed'
            for log in xcodebuild.log xcodebuild-export.log; do
              [ -f "$log" ] || continue
              echo "### $log: errors"
              echo '```'
              grep -E '(error:|fatal error:|\*\* (ARCHIVE|EXPORT) FAILED|The following build commands failed)' "$log" | sort -u | head -n 80
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            applications/qnet-mobile/xcodebuild.log
            applications/qnet-mobile/xcodebuild-export.log
            applications/qnet-mobile/build/Logs
          if-no-files-found: ignore

      # A run that uploaded keeps its certificate until the next run removes it (scripts/asc-signing.py).
      - name: Remove this run's signing identity
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [ -z "${SIGNING_KEYCHAIN:-}" ] || security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/signing"
          if [ -n "${CERT_ID:-}" ] && [ "${UPLOADED:-}" != 1 ]; then
            python3 scripts/asc-signing.py discard "$CERT_ID" "$PROFILE_ID" || true
          fi

      - name: Delete the API key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" "$RUNNER_TEMP/ExportOptions.plist"
          rmdir "$HOME/.appstoreconnect/private_keys" "$HOME/.appstoreconnect" 2>/dev/null || true
