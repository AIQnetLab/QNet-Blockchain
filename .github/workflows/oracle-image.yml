name: Build Device Oracle Image

# The device oracle runs on its own two hosts and is rolled with scripts/deploy-oracle.sh, never
# automatically. This workflow tests it and publishes the image that script pulls; the image carries
# no secret (keys and certificates are placed on the hosts).
on:
  push:
    branches: [testnet]
    paths:
      - 'development/qnet-device-oracle/**'
      - 'core/qnet-device-attest/**'
      - 'docs/protocols/light-node.vectors.json'
      - '.github/workflows/oracle-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/aiqnetlab/qnet-device-oracle
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test the oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev cmake

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            development/qnet-device-oracle/target
          key: ${{ runner.os }}-oracle-${{ hashFiles('development/qnet-device-oracle/Cargo.lock') }}

      # Scripted vendor side only: no test reaches Apple, Google or a node.
      - name: Test
        working-directory: development/qnet-device-oracle
        run: cargo test --locked

  build:
    name: Build and push the image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (versioned + latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: development/qnet-device-oracle/Dockerfile
          push: true
          build-args: |
            QNET_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=oracle
          cache-to: type=gha,mode=max,scope=oracle

      # The oracle hosts pull without a login, as the genesis hosts do for the node image.
      - name: Make ghcr.io package public
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/AIQnetLab/packages/container/qnet-device-oracle" \
            -d '{"visibility":"public"}' || echo "Note: set package to public manually if this fails"

      - name: Summary
        run: |
          echo "## Device oracle image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`${{ env.IMAGE }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| commit | \`${{ env.IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Roll it with \`scripts/deploy-oracle.sh up\` (ORACLE_IMAGE pins a commit tag)." >> $GITHUB_STEP_SUMMARY
