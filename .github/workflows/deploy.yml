name: Build & Deploy QNet Production

# ─────────────────────────────────────────────────────────────
# Triggers on push to testnet.
#
# QNet node types:
#   Genesis (5)  — bootstrap/consensus nodes, managed by core team
#   Super        — community validator nodes, self-managed
#   Light        — mobile app nodes (APK, not Docker)
#
# Update flow:
#   1. Build Docker image ONCE in CI → push to PUBLIC ghcr.io
#   2. Genesis nodes — DELIBERATE rolling deploy: run scripts/deploy-genesis.sh. They do NOT
#      auto-update: install-genesis.sh installs no Watchtower, on purpose. Five consensus nodes
#      pulling a bad build at once is not a risk worth taking for convenience.
#   3. Super nodes   — self-update via Watchtower (polls :latest, installed by install-super-node.sh)
#   4. Light nodes   — mobile APK (separate release process)
#
# A push builds and publishes only :<sha>. :latest moves to a build only through the promote job below,
# run after the genesis fleet runs that build and passed its gate (deploy-genesis.sh), so no auto-updating
# node runs code the genesis fleet has not taken first.
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [testnet]
  workflow_dispatch:
    inputs:
      promote_sha:
        description: 'Point :latest at this already published :<sha> (after the genesis fleet passed its gate)'
        required: false
        default: ''

env:
  # Public image — any node operator can docker pull without auth
  IMAGE: ghcr.io/aiqnetlab/qnet-production

jobs:
  # ───────────────────────────────────────────────────────────
  # Stage 1: Build once, push public image to ghcr.io
  # All node types (genesis / super) use this same image
  # ───────────────────────────────────────────────────────────
  build:
    name: Build Docker image
    if: github.event_name == 'push' || github.event.inputs.promote_sha == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (versioned only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: development/qnet-integration/Dockerfile.production
          push: true
          # Stamped into the runtime image so every node reports the commit it runs on /healthz.
          build-args: |
            QNET_BUILD_ID=${{ github.sha }}
          # :sha only — the genesis roll pins it; :latest moves later through the promote job
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
          # GitHub Actions layer cache — second build takes ~2 min instead of 20
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Make package public so ANY node operator can docker pull without login
      - name: Make ghcr.io package public
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/AIQnetLab/packages/container/qnet-production" \
            -d '{"visibility":"public"}' || echo "Note: set package to public manually if this fails"

  # ───────────────────────────────────────────────────────────
  # Stage 2: Publish summary
  # No deploy stage here on purpose: the genesis roll is operator-driven (scripts/deploy-genesis.sh),
  # and the wallet seeds it would need are not in CI.
  # For immediate genesis deploy: run scripts/deploy-genesis.sh locally
  # ───────────────────────────────────────────────────────────
  notify:
    name: Publish summary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Docker image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| commit | \`${{ env.IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Genesis nodes** — NOT automatic. Roll them with \`scripts/deploy-genesis.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "**:latest** — unchanged. It moves to this build only after the genesis fleet passed its gate (promote job)" >> $GITHUB_STEP_SUMMARY

  # ───────────────────────────────────────────────────────────
  # Promote: point :latest at an already published :<sha>, without a rebuild. Run by deploy-genesis.sh
  # (gh workflow run deploy.yml -f promote_sha=<sha>) once every genesis node runs that build and passed
  # its gate. Refuses a sha that was never published.
  # ───────────────────────────────────────────────────────────
  promote:
    name: Promote :latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_sha != ''
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Check the sha
        env:
          SHA: ${{ github.event.inputs.promote_sha }}
        run: |
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "promote_sha must be a full 40-hex commit"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest at the published build
        env:
          SHA: ${{ github.event.inputs.promote_sha }}
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE }}:$SHA" > /dev/null
          docker buildx imagetools create -t "${{ env.IMAGE }}:latest" "${{ env.IMAGE }}:$SHA"
          echo "## :latest → \`${{ env.IMAGE }}:$SHA\`" >> $GITHUB_STEP_SUMMARY
